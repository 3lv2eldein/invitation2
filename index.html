<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوة خطوبة محمد & زهرة</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cairo','Amiri',serif;
overflow-x:hidden;
background:
linear-gradient(
180deg,
#f5efe6 0%,
#efe4d1 45%,
#e8dcc7 100%
);
color:#4a4035;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
min-height:100vh;
}

.stars{
position:fixed;
inset:0;
opacity:.25;
background-image:
radial-gradient(circle at 20% 30%,rgba(212,175,55,.25) 1px,transparent 1px),
radial-gradient(circle at 80% 20%,rgba(212,175,55,.2) 2px,transparent 2px),
radial-gradient(circle at 50% 70%,rgba(212,175,55,.15) 1px,transparent 1px);
background-size:250px 250px;
animation:twinkle 6s ease-in-out infinite alternate;
z-index:-1;
}

@keyframes twinkle{
from{
opacity:.2;
}
to{
opacity:.4;
}
}

.loading{
position:fixed;
inset:0;
background:#f5efe6;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-family:'Amiri',serif;
color:#8b6914;
z-index:9999;
transition:1s;
}

.loading.hide{
opacity:0;
pointer-events:none;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px;
position:relative;
}

.main-title{
font-size:58px;
color:#8b6914;
font-family:'Amiri',serif;
margin-bottom:12px;
text-align:center;
text-shadow:0 0 12px rgba(212,175,55,.25);
}

.sub-title{
font-size:20px;
color:#6b5b4f;
margin-bottom:45px;
text-align:center;
}

.door-container{
position:relative;
width:320px;
height:500px;
perspective:1400px;
}

.door-frame{
position:absolute;
inset:0;
border-radius:180px 180px 0 0;
padding:8px;
background:
linear-gradient(
180deg,
#8b6914,
#d4af37,
#8b6914
);
box-shadow:
0 0 30px rgba(212,175,55,.35);
}

.door-inner{
width:100%;
height:100%;
overflow:hidden;
position:relative;
border-radius:170px 170px 0 0;
background:
linear-gradient(
180deg,
#6b4e0a,
#8b6914,
#6b4e0a
);
}

.door-light{
position:absolute;
left:50%;
bottom:0;
transform:translateX(-50%);
width:0%;
height:100%;
background:
linear-gradient(
180deg,
rgba(255,255,255,.9),
rgba(255,235,180,.7),
rgba(255,215,100,.2)
);
transition:3s ease;
z-index:1;
}

.door-light.open{
width:90%;
box-shadow:
0 0 50px rgba(255,255,200,.8),
0 0 120px rgba(255,220,100,.5);
}

.door{
position:absolute;
top:0;
width:50%;
height:100%;
background:
linear-gradient(
180deg,
#c9a227,
#8b6914
);
transition:transform 3s ease;
z-index:2;
backface-visibility:hidden;
}

.left-door{
left:0;
transform-origin:left;
border-radius:170px 0 0 0;
}

.right-door{
right:0;
transform-origin:right;
border-radius:0 170px 0 0;
}

.left-door.open{
transform:rotateY(-110deg);
}

.right-door.open{
transform:rotateY(110deg);
}

.handle{
position:absolute;
top:50%;
width:12px;
height:45px;
background:gold;
border-radius:10px;
}

.left-door .handle{
right:20px;
}

.right-door .handle{
left:20px;
}

.enter-btn{
margin-top:40px;
padding:16px 42px;
border:none;
border-radius:50px;
background:
linear-gradient(
135deg,
#d4af37,
#b8860b
);
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.3s;
box-shadow:
0 10px 30px rgba(212,175,55,.3);
}

.enter-btn:hover{
transform:scale(1.05);
}

.countdown{
margin-top:35px;
font-size:22px;
text-align:center;
line-height:2;
color:#8b6914;
}

.details{
display:none;
padding:60px 20px;
animation:fade 1s ease;
}

.details.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:none;
}
}

.card{
background:rgba(255,255,255,.65);
backdrop-filter:blur(10px);
border:1px solid rgba(212,175,55,.15);
padding:28px;
border-radius:28px;
max-width:500px;
margin:20px auto;
text-align:center;
box-shadow:
0 10px 40px rgba(0,0,0,.08);
}

.card h3{
font-size:18px;
margin-bottom:12px;
color:#b8860b;
}

.card p{
font-size:24px;
color:#4a4035;
}

.map-btn,
.whatsapp-btn{
display:inline-block;
margin-top:20px;
padding:15px 30px;
border-radius:40px;
text-decoration:none;
font-weight:700;
transition:.3s;
}

.map-btn{
background:#2563eb;
color:white;
}

.whatsapp-btn{
background:#25D366;
color:white;
}

.map-btn:hover,
.whatsapp-btn:hover{
transform:translateY(-3px);
}

form{
margin-top:30px;
}

input,
textarea{
width:100%;
padding:16px;
margin-bottom:15px;
border-radius:16px;
border:1px solid rgba(212,175,55,.3);
background:white;
font-size:16px;
font-family:'Cairo';
color:#4a4035;
}

input:focus,
textarea:focus{
outline:none;
border-color:#d4af37;
box-shadow:
0 0 10px rgba(212,175,55,.2);
}

textarea{
resize:none;
min-height:120px;
}

.radio-group{
display:flex;
flex-direction:column;
gap:14px;
text-align:right;
margin-bottom:20px;
}

.submit-btn{
background:
linear-gradient(
135deg,
#22c55e,
#16a34a
);
border:none;
padding:15px 40px;
border-radius:40px;
font-size:18px;
font-weight:700;
color:white;
cursor:pointer;
transition:.3s;
}

.submit-btn:hover{
transform:scale(1.05);
}

.footer{
text-align:center;
margin-top:50px;
padding-bottom:30px;
font-size:15px;
opacity:.7;
}

.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

@media(max-width:480px){

.main-title{
font-size:42px;
}

.sub-title{
font-size:17px;
}

.door-container{
width:260px;
height:410px;
}

.card p{
font-size:20px;
}

}

</style>
</head>

<body>

<div class="loading" id="loading">
✨ محمد & زهرة ✨
</div>

<div class="stars"></div>

<section class="hero" id="hero">

<h1 class="main-title">
محمد & زهرة
</h1>

<p class="sub-title">
يدعوانكم لحضور حفل خطوبتهما
</p>

<div class="door-container">

<div class="door-frame">

<div class="door-inner">

<div class="door-light" id="light"></div>

<div class="door left-door" id="leftDoor">
<div class="handle"></div>
</div>

<div class="door right-door" id="rightDoor">
<div class="handle"></div>
</div>

</div>
</div>
</div>

<button class="enter-btn" onclick="openDoor()">
💍 اضغط للدخول
</button>

<div class="countdown" id="countdown"></div>

</section>

<section class="details" id="details">

<div class="card">
<h3>📅 التاريخ</h3>
<p>29 مايو 2026</p>
</div>

<div class="card">
<h3>🕗 الوقت</h3>
<p>8:00 مساءً</p>
</div>

<div class="card">
<h3>📍 المكان</h3>

<p>أمام منزل العروسة</p>

<a
class="map-btn"
href="https://maps.app.goo.gl/5RxhiYNr7xN18XLJ8?g_st=aw"
target="_blank">

فتح الموقع على الخريطة

</a>

</div>

<div class="card">

<h3>💌 تأكيد الحضور</h3>

<form onsubmit="sendWhatsApp(event)">

<input
type="text"
id="name"
placeholder="اكتب اسمك"
required>

<div class="radio-group">

<label>
<input
type="radio"
name="attend"
value="سأحضر"
required>

 نعم سأحضر ✨
</label>

<label>
<input
type="radio"
name="attend"
value="لن أتمكن من الحضور">

 لن أتمكن من الحضور

</label>

</div>

<textarea
id="message"
placeholder="رسالتك الجميلة..."></textarea>

<button class="submit-btn">
إرسال التأكيد واتساب
</button>

</form>

</div>

<div class="footer">
محمد & زهرة · 2026
</div>

</section>

<audio id="doorSound">
<source src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3" type="audio/mpeg">
</audio>

<script>

setTimeout(()=>{

document.getElementById('loading')
.classList.add('hide');

},2200);

function openDoor(){

document.getElementById('doorSound').play();

document.getElementById('leftDoor')
.classList.add('open');

document.getElementById('rightDoor')
.classList.add('open');

document.getElementById('light')
.classList.add('open');

createConfetti();

setTimeout(()=>{

document.getElementById('hero')
.style.display='none';

document.getElementById('details')
.classList.add('active');

window.scrollTo(0,0);

},3200);

}

function createConfetti(){

for(let i=0;i<70;i++){

const conf=document.createElement('div');

conf.className='confetti';

conf.style.left=Math.random()*100+'vw';

conf.style.background=
`hsl(${Math.random()*360},100%,70%)`;

conf.style.animationDuration=
(Math.random()*3+2)+'s';

document.body.appendChild(conf);

setTimeout(()=>{

conf.remove();

},5000);

}

}

function sendWhatsApp(e){

e.preventDefault();

const name=
document.getElementById('name').value;

const attend=
document.querySelector(
'input[name="attend"]:checked'
).value;

const message=
document.getElementById('message').value;

const text=

`💍 تأكيد حضور جديد

👤 الاسم:
${name}

📌 الحضور:
${attend}

💌 الرسالة:
${message}`;

window.open(

`https://wa.me/201017886432?text=${encodeURIComponent(text)}`,

'_blank'

);

}

function updateCountdown(){

const eventDate=
new Date('2026-05-29T20:00:00');

const now=new Date();

const diff=eventDate-now;

if(diff<=0){

document.getElementById('countdown')
.innerHTML='🎉 الليلة المنتظرة وصلت';

return;

}

const days=
Math.floor(diff/(1000*60*60*24));

const hours=
Math.floor((diff/(1000*60*60))%24);

const mins=
Math.floor((diff/(1000*60))%60);

document.getElementById('countdown')
.innerHTML=

`⏳ متبقي على الخطوبة <br>
${days} يوم • ${hours} ساعة • ${mins} دقيقة`;

}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
